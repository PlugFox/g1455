<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="776" height="240" viewBox="0 0 776 240" role="img" aria-labelledby="t d">
  <title id="t">g1455</title>
  <desc id="d">Liquid Glass for Flutter: a glass capsule refracts and blurs the word g1455 printed in red and cyan over colour fields and a grid.</desc>
  <defs>
    <!-- The showcase's backdrop, drawn once and used three times: as it is,
         magnified and blurred under the capsule, and blurred under the pill. -->
    <radialGradient id="pink"><stop offset="0" stop-color="#FF2D95" stop-opacity=".85"/><stop offset="1" stop-color="#FF2D95" stop-opacity="0"/></radialGradient>
    <radialGradient id="cyan"><stop offset="0" stop-color="#00D1FF" stop-opacity=".85"/><stop offset="1" stop-color="#00D1FF" stop-opacity="0"/></radialGradient>
    <radialGradient id="amber"><stop offset="0" stop-color="#FFB020" stop-opacity=".85"/><stop offset="1" stop-color="#FFB020" stop-opacity="0"/></radialGradient>
    <radialGradient id="violet"><stop offset="0" stop-color="#7C4DFF" stop-opacity=".85"/><stop offset="1" stop-color="#7C4DFF" stop-opacity="0"/></radialGradient>
    <radialGradient id="green"><stop offset="0" stop-color="#00E676" stop-opacity=".85"/><stop offset="1" stop-color="#00E676" stop-opacity="0"/></radialGradient>
    <radialGradient id="orange"><stop offset="0" stop-color="#FF5A36" stop-opacity=".85"/><stop offset="1" stop-color="#FF5A36" stop-opacity="0"/></radialGradient>
    <pattern id="minor" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 .5H.5V20" fill="none" stroke="#fff" stroke-opacity=".14"/>
    </pattern>
    <pattern id="major" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M100 .5H.5V100" fill="none" stroke="#fff" stroke-opacity=".3"/>
    </pattern>
    <clipPath id="card"><rect width="776" height="240" rx="24"/></clipPath>
    <g id="backdrop" style="isolation:isolate">
      <rect width="776" height="240" fill="#0B0F24"/>
      <circle cx="90" cy="40" r="140" fill="url(#pink)"/>
      <circle cx="300" cy="210" r="130" fill="url(#violet)"/>
      <circle cx="470" cy="20" r="120" fill="url(#cyan)"/>
      <circle cx="640" cy="200" r="140" fill="url(#amber)"/>
      <circle cx="760" cy="40" r="100" fill="url(#green)"/>
      <circle cx="200" cy="140" r="90" fill="url(#orange)"/>
      <rect width="776" height="240" fill="url(#minor)"/>
      <rect width="776" height="240" fill="url(#major)"/>
      <g font-family="Roboto, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="900" font-size="132" letter-spacing="-4" text-anchor="middle">
        <text x="380" y="150" fill="#FF1E3C" style="mix-blend-mode:screen">g1455</text>
        <text x="388" y="150" fill="#00E5FF" style="mix-blend-mode:screen">g1455</text>
      </g>
    </g>
    <filter id="frost" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="shadow" x="-20%" y="-40%" width="140%" height="180%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".35"/></filter>
    <clipPath id="lens"><rect x="452" y="36" width="276" height="132" rx="66"/></clipPath>
    <clipPath id="pill"><rect x="48" y="186" width="250" height="36" rx="18"/></clipPath>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".9"/>
      <stop offset=".45" stop-color="#fff" stop-opacity=".12"/>
      <stop offset=".6" stop-color="#fff" stop-opacity=".1"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".7"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".22"/>
      <stop offset=".5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#card)">
    <use xlink:href="#backdrop"/>

    <!-- The capsule: the backdrop magnified about its centre and blurred,
         a cool tint, a sheen, and a rim brighter at two opposite corners. -->
    <rect x="452" y="36" width="276" height="132" rx="66" fill="#000" filter="url(#shadow)" opacity=".6"/>
    <g clip-path="url(#lens)">
      <g filter="url(#frost)">
        <use xlink:href="#backdrop" transform="translate(590 102) scale(1.18) translate(-590 -102)"/>
      </g>
      <rect x="452" y="36" width="276" height="132" fill="#C8D7FF" fill-opacity=".1"/>
      <rect x="452" y="36" width="276" height="132" fill="url(#sheen)"/>
    </g>
    <rect x="452.75" y="36.75" width="274.5" height="130.5" rx="65.25" fill="none" stroke="url(#rim)" stroke-width="1.5"/>

    <!-- The pill under the tagline: frosted, darker. -->
    <g clip-path="url(#pill)">
      <g filter="url(#soft)"><use xlink:href="#backdrop"/></g>
      <rect x="48" y="186" width="250" height="36" fill="#0B0F24" fill-opacity=".45"/>
    </g>
    <rect x="48.5" y="186.5" width="249" height="35" rx="17.5" fill="none" stroke="url(#rim)"/>
    <text x="173" y="209.5" text-anchor="middle" fill="#fff" font-family="Roboto, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" letter-spacing=".3">Liquid Glass for Flutter</text>
  </g>
</svg>
