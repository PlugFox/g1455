<svg xmlns="http://www.w3.org/2000/svg" width="360" height="250" viewBox="0 0 360 250" role="img" aria-labelledby="t d">
  <title id="t">A capture only when something changed</title>
  <desc id="d">Twelve frames. The content changes on frames 1, 8 and 9, and the glass moves on frames 3 to 6. The host captures on frames 1, 8 and 9 only; on every other frame, moving glass included, it keeps the capture it has.</desc>
  <style>
    svg { font-family: Roboto, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .head { animation: head 6s steps(12, end) infinite; }
    @keyframes head { from { transform: translateX(0); } to { transform: translateX(240px); } }
    @media (prefers-reduced-motion: reduce) { .head { display: none; } }
  </style>
  <defs>
    <radialGradient id="violet"><stop offset="0" stop-color="#7C4DFF" stop-opacity=".5"/><stop offset="1" stop-color="#7C4DFF" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 .5H.5V20" fill="none" stroke="#fff" stroke-opacity=".05"/></pattern>
    <clipPath id="card"><rect width="360" height="250" rx="20"/></clipPath>
    <!-- The three marks: a changed frame, a moved glass, a capture. -->
    <rect id="changed" x="-6" y="-6" width="12" height="12" rx="2" fill="#fff" fill-opacity=".85"/>
    <rect id="still" x="-2" y="-2" width="4" height="4" rx="1" fill="#fff" fill-opacity=".3"/>
    <rect id="moved" x="-8" y="-5" width="16" height="10" rx="5" fill="#00D1FF" fill-opacity=".3" stroke="#00D1FF" stroke-width="1.5"/>
    <circle id="capture" r="6" fill="#FF2D95"/>
    <circle id="kept" r="5" fill="none" stroke="#fff" stroke-opacity=".45" stroke-width="1.5"/>
  </defs>

  <g clip-path="url(#card)">
    <rect width="360" height="250" fill="#0B0F24"/>
    <circle cx="330" cy="20" r="120" fill="url(#violet)"/>
    <rect width="360" height="250" fill="url(#grid)"/>

    <text x="20" y="34" fill="#fff" font-size="16" font-weight="700">A capture only on change</text>
    <text x="20" y="54" fill="#fff" fill-opacity=".72" font-size="12">A still screen, and glass moving over still</text>
    <text x="20" y="70" fill="#fff" fill-opacity=".72" font-size="12">content, keep the capture they have.</text>

    <!-- The playhead steps through the twelve frames. -->
    <rect class="head" x="100" y="86" width="20" height="104" rx="4" fill="#fff" fill-opacity=".08"/>

    <g fill="#fff" fill-opacity=".72" font-size="12">
      <text x="20" y="108">content</text>
      <text x="20" y="140">glass</text>
      <text x="20" y="172">capture</text>
    </g>

    <!-- Frames 1 to 12, 20 apart, centred from x 110. -->
    <g transform="translate(0 104)">
      <use href="#changed" x="110"/><use href="#still" x="130"/><use href="#still" x="150"/><use href="#still" x="170"/>
      <use href="#still" x="190"/><use href="#still" x="210"/><use href="#still" x="230"/><use href="#changed" x="250"/>
      <use href="#changed" x="270"/><use href="#still" x="290"/><use href="#still" x="310"/><use href="#still" x="330"/>
    </g>
    <g transform="translate(0 136)">
      <use href="#still" x="110"/><use href="#still" x="130"/><use href="#moved" x="150"/><use href="#moved" x="170"/>
      <use href="#moved" x="190"/><use href="#moved" x="210"/><use href="#still" x="230"/><use href="#still" x="250"/>
      <use href="#still" x="270"/><use href="#still" x="290"/><use href="#still" x="310"/><use href="#still" x="330"/>
    </g>
    <g transform="translate(0 168)">
      <use href="#capture" x="110"/><use href="#kept" x="130"/><use href="#kept" x="150"/><use href="#kept" x="170"/>
      <use href="#kept" x="190"/><use href="#kept" x="210"/><use href="#kept" x="230"/><use href="#capture" x="250"/>
      <use href="#capture" x="270"/><use href="#kept" x="290"/><use href="#kept" x="310"/><use href="#kept" x="330"/>
    </g>

    <!-- Legend. -->
    <use href="#capture" x="26" y="210"/><use href="#kept" x="100" y="210"/><use href="#moved" x="160" y="210"/>
    <g font-size="11" fill="#fff" fill-opacity=".72">
      <text x="38" y="214">capture</text><text x="112" y="214">kept</text><text x="174" y="214">glass moved</text>
    </g>
    <text x="20" y="236" fill="#fff" font-size="13" font-weight="600">12 frames, 3 captures</text>
  </g>
  <rect x=".5" y=".5" width="359" height="249" rx="19.5" fill="none" stroke="#fff" stroke-opacity=".12"/>
</svg>
