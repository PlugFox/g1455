<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="360" height="250" viewBox="0 0 360 250" role="img" aria-labelledby="t d">
  <title id="t">One host, one capture</title>
  <desc id="d">A screen with three glass surfaces, a bar, a card and a button. The host captures what is under all three into one atlas, one slot per surface: one capture, three draws.</desc>
  <style>
    svg { font-family: Roboto, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .scan { animation: scan 3.6s ease-in-out infinite; }
    .flow { stroke-dasharray: 4 4; animation: flow .6s linear infinite; }
    .slot { animation: slot 3.6s ease-in-out infinite; }
    @keyframes scan { 0% { transform: translateY(0); opacity: 0; } 5% { opacity: 1; } 40% { transform: translateY(150px); opacity: 1; } 45%, 100% { transform: translateY(150px); opacity: 0; } }
    @keyframes flow { to { stroke-dashoffset: -8; } }
    @keyframes slot { 0%, 30% { opacity: .45; } 50%, 90% { opacity: 1; } 100% { opacity: .45; } }
    @media (prefers-reduced-motion: reduce) { .scan { display: none; } .flow, .slot { animation: none; } }
  </style>
  <defs>
    <radialGradient id="pink"><stop offset="0" stop-color="#FF2D95" stop-opacity=".85"/><stop offset="1" stop-color="#FF2D95" stop-opacity="0"/></radialGradient>
    <radialGradient id="cyan"><stop offset="0" stop-color="#00D1FF" stop-opacity=".85"/><stop offset="1" stop-color="#00D1FF" stop-opacity="0"/></radialGradient>
    <radialGradient id="amber"><stop offset="0" stop-color="#FFB020" stop-opacity=".85"/><stop offset="1" stop-color="#FFB020" stop-opacity="0"/></radialGradient>
    <radialGradient id="violet"><stop offset="0" stop-color="#7C4DFF" stop-opacity=".5"/><stop offset="1" stop-color="#7C4DFF" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 .5H.5V20" fill="none" stroke="#fff" stroke-opacity=".05"/></pattern>
    <pattern id="pixels" width="4" height="4" patternUnits="userSpaceOnUse"><path d="M4 .5H.5V4" fill="none" stroke="#0B0F24" stroke-opacity=".35"/></pattern>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset=".45" stop-color="#fff" stop-opacity=".12"/>
      <stop offset=".6" stop-color="#fff" stop-opacity=".1"/><stop offset="1" stop-color="#fff" stop-opacity=".7"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity=".45"/>
    </linearGradient>
    <filter id="frost" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3"/></filter>
    <clipPath id="card"><rect width="360" height="250" rx="20"/></clipPath>
    <clipPath id="phone"><rect x="24" y="74" width="108" height="156" rx="14"/></clipPath>
    <clipPath id="atlas"><rect x="216" y="92" width="120" height="100" rx="6"/></clipPath>
    <!-- What the application paints: colour and a list, in the phone's frame. -->
    <g id="screen">
      <rect x="24" y="74" width="108" height="156" fill="#141A3A"/>
      <circle cx="40" cy="96" r="54" fill="url(#pink)"/>
      <circle cx="122" cy="150" r="50" fill="url(#cyan)"/>
      <circle cx="58" cy="214" r="46" fill="url(#amber)"/>
      <g fill="#fff" fill-opacity=".55">
        <rect x="36" y="110" width="64" height="5" rx="2.5"/><rect x="36" y="121" width="44" height="5" rx="2.5"/>
        <rect x="44" y="142" width="54" height="5" rx="2.5"/><rect x="44" y="153" width="38" height="5" rx="2.5"/>
        <rect x="36" y="182" width="70" height="5" rx="2.5"/><rect x="36" y="193" width="50" height="5" rx="2.5"/>
      </g>
    </g>
    <clipPath id="bar"><rect x="32" y="82" width="92" height="18" rx="9"/></clipPath>
    <clipPath id="panel"><rect x="36" y="134" width="84" height="40" rx="10"/></clipPath>
    <clipPath id="button"><rect x="56" y="204" width="44" height="18" rx="9"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="360" height="250" fill="#0B0F24"/>
    <circle cx="330" cy="20" r="120" fill="url(#violet)"/>
    <rect width="360" height="250" fill="url(#grid)"/>

    <text x="20" y="34" fill="#fff" font-size="16" font-weight="700">One host, one capture</text>
    <text x="20" y="54" fill="#fff" fill-opacity=".72" font-size="12">Every surface samples its own slot of one atlas.</text>

    <!-- The screen, its three glass surfaces, and the capture sweeping it. -->
    <use xlink:href="#screen" clip-path="url(#phone)"/>
    <g clip-path="url(#bar)"><use xlink:href="#screen" filter="url(#frost)"/><rect x="32" y="82" width="92" height="18" fill="#fff" fill-opacity=".14"/></g>
    <g clip-path="url(#panel)"><use xlink:href="#screen" filter="url(#frost)"/><rect x="36" y="134" width="84" height="40" fill="#fff" fill-opacity=".14"/></g>
    <g clip-path="url(#button)"><use xlink:href="#screen" filter="url(#frost)"/><rect x="56" y="204" width="44" height="18" fill="#fff" fill-opacity=".14"/></g>
    <rect x="32.75" y="82.75" width="90.5" height="16.5" rx="8.25" fill="none" stroke="#00D1FF" stroke-width="1.5"/>
    <rect x="36.75" y="134.75" width="82.5" height="38.5" rx="9.25" fill="none" stroke="#FFB020" stroke-width="1.5"/>
    <rect x="56.75" y="204.75" width="42.5" height="16.5" rx="8.25" fill="none" stroke="#FF2D95" stroke-width="1.5"/>
    <g clip-path="url(#phone)"><rect class="scan" x="24" y="56" width="108" height="24" fill="url(#band)"/></g>
    <rect x="24.5" y="74.5" width="107" height="155" rx="13.5" fill="none" stroke="url(#rim)"/>

    <!-- One capture into the atlas. -->
    <text x="174" y="134" fill="#fff" fill-opacity=".72" font-size="11" text-anchor="middle">capture</text>
    <path class="flow" d="M142 142H204" fill="none" stroke="#fff" stroke-opacity=".8" stroke-width="1.5"/>
    <path d="M202 137.5l7 4.5-7 4.5z" fill="#fff" fill-opacity=".8"/>

    <!-- The atlas: the three regions under glass, packed and at a lower resolution. -->
    <text x="216" y="84" fill="#fff" fill-opacity=".72" font-size="11">atlas</text>
    <rect x="216" y="92" width="120" height="100" rx="6" fill="#141A3A"/>
    <g clip-path="url(#atlas)" class="slot">
      <svg x="222" y="98" width="108" height="22" viewBox="32 82 92 18" preserveAspectRatio="none"><use xlink:href="#screen" filter="url(#frost)"/></svg>
      <svg x="222" y="126" width="66" height="60" viewBox="36 134 84 40" preserveAspectRatio="none"><use xlink:href="#screen" filter="url(#frost)"/></svg>
      <svg x="294" y="126" width="36" height="24" viewBox="56 204 44 18" preserveAspectRatio="none"><use xlink:href="#screen" filter="url(#frost)"/></svg>
      <rect x="216" y="92" width="120" height="100" fill="url(#pixels)"/>
      <rect x="222.75" y="98.75" width="106.5" height="20.5" fill="none" stroke="#00D1FF" stroke-width="1.5"/>
      <rect x="222.75" y="126.75" width="64.5" height="58.5" fill="none" stroke="#FFB020" stroke-width="1.5"/>
      <rect x="294.75" y="126.75" width="34.5" height="22.5" fill="none" stroke="#FF2D95" stroke-width="1.5"/>
    </g>
    <rect x="216.5" y="92.5" width="119" height="99" rx="5.5" fill="none" stroke="#fff" stroke-opacity=".3"/>

    <text x="276" y="214" fill="#fff" font-size="13" font-weight="600" text-anchor="middle">1 capture, 3 draws</text>
    <text x="276" y="230" fill="#fff" fill-opacity=".72" font-size="11" text-anchor="middle">not one read per surface</text>
  </g>
  <rect x=".5" y=".5" width="359" height="249" rx="19.5" fill="none" stroke="#fff" stroke-opacity=".12"/>
</svg>
